# Private parameters of sonic_teleop_node. Values use servo command units.
servo_center: 2048.0
servo_range: 512.0
auto_frequency: 1.5
auto_default_amplitude: 256.0
auto_amplitude_rate: 64.0
joy_dead_zone: 0.1
joy_timeout_s: 0.5
# continue: retain manual position / keep auto and tracking running on Joy loss.
# stop: center and latch stopped after joy_timeout_s. Other faults still stop.
joy_timeout_action: continue
update_rate: 50.0

steering_axis: 2
amplitude_decrease_axis: 3
amplitude_increase_axis: 4
stop_button: 1
auto_button: 3
manual_button: 0
tracking_button: 2
status_button: 8
polarity_toggle_button: 9  # Option: -1 follows sound, +1 avoids sound.
status_local_echo: false
amplitude_buttons: [6, 7]

acoustic_steering:
  # sonic_vim4.launch explicitly enables tracking for the experiment scene.
  enabled: false
  threshold: 0.15  # Full bar width: 15%, +/-7.5% around the midpoint.
  bias: 256.0
  lr_voltage_offset_v: 0.0
  # Left share += offset, right share -= offset; +0.05 shifts the frame left 5%.
  lr_ratio_offset: 0.0
  max_age_s: 0.5
  future_tolerance_s: 0.05
  left_bias_sign: -1
  gap_s: 0.2
  low_signal_v: 0.001
